<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Management | Englishmates Admin</title><meta name="robots" content="noindex,nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{color-scheme:dark}body{background:#080d1b;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.panel{background:#111b30;border:1px solid #293752}.field{background:#080f20;border:1px solid #35445f;color:white}.muted{color:#9aa9c0}.tab[aria-selected=true]{background:#6d45d9;color:white;border-color:#8b70e8}.btn{border-radius:12px;padding:10px 15px;font-weight:700}.btn-primary{background:#7047df}.btn-green{background:#087f5b}.btn-red{background:#8f3345}.btn-muted{border:1px solid #394862}.status{font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 9px;border-radius:99px;background:#27344c;color:#cbd5e1}.status-pending{background:#493719;color:#fcd34d}.status-approved{background:#123e34;color:#6ee7b7}.status-rejected{background:#4a2631;color:#fda4af}.status-inactive{background:#30394a;color:#cbd5e1}input,textarea{width:100%;border-radius:10px;padding:11px}.hidden{display:none!important}
</style>
</head>
<body>
<main class="max-w-6xl mx-auto px-4 py-8 md:py-12">
<header class="flex flex-wrap items-center justify-between gap-4"><div><a href="/" class="font-black text-xl">Englishmates</a><p class="text-xs uppercase tracking-widest text-violet-300 font-bold mt-7">Restricted administration</p><h1 class="text-3xl md:text-4xl font-black mt-2">Tutor management</h1><p class="muted mt-2">Review applications and manage approved tutor profiles.</p></div><a href="/" class="text-violet-300 text-sm">← Back to website</a></header>
<section id="login" class="panel rounded-2xl p-6 max-w-md mt-8"><h2 class="text-xl font-bold">Admin sign in</h2><p class="muted text-sm mt-2">Use the authorized, email-verified admin account.</p><form id="loginForm" class="grid gap-3 mt-5"><input name="email" type="email" required autocomplete="username" placeholder="Admin email" class="field"><input name="password" type="password" required autocomplete="current-password" placeholder="Password" class="field"><button id="loginBtn" class="btn btn-primary">Sign in</button></form><p id="loginMessage" role="status" class="text-sm mt-3"></p></section>
<section id="dashboard" class="hidden mt-8">
<div class="panel rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs muted">SIGNED IN AS</p><p id="identity" class="font-bold mt-1"></p></div><button id="logout" class="btn btn-muted">Sign out</button></div>
<div id="notice" role="status" class="text-sm mt-4"></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5"><div class="panel rounded-xl p-4"><p class="muted text-xs">Pending</p><p id="count-pending" class="text-2xl font-black mt-1">—</p></div><div class="panel rounded-xl p-4"><p class="muted text-xs">Approved</p><p id="count-approved" class="text-2xl font-black mt-1">—</p></div><div class="panel rounded-xl p-4"><p class="muted text-xs">Rejected</p><p id="count-rejected" class="text-2xl font-black mt-1">—</p></div><div class="panel rounded-xl p-4"><p class="muted text-xs">Inactive</p><p id="count-inactive" class="text-2xl font-black mt-1">—</p></div></div>
<div class="flex flex-wrap gap-2 mt-6" id="tabs" role="tablist" aria-label="Tutor status"><button class="tab btn btn-muted" data-status="pending" aria-selected="true">Pending</button><button class="tab btn btn-muted" data-status="approved" aria-selected="false">Approved</button><button class="tab btn btn-muted" data-status="rejected" aria-selected="false">Rejected</button><button class="tab btn btn-muted" data-status="inactive" aria-selected="false">Inactive</button><button class="tab btn btn-muted" data-status="all" aria-selected="false">All tutors</button></div>
<div class="flex flex-col sm:flex-row gap-3 mt-4"><input id="search" class="field flex-1" type="search" placeholder="Search this list by name, email, phone or subject"><button id="refresh" class="btn btn-muted">Refresh</button></div>
<div id="items" class="grid gap-4 mt-5"></div><div class="flex justify-center mt-5"><button id="more" class="btn btn-muted hidden">Load more</button></div>
</section></main>
<dialog id="editDialog" class="panel text-white rounded-2xl p-0 w-[min(94vw,620px)] backdrop:bg-black/70"><form id="editForm" class="p-6 grid gap-4"><div class="flex justify-between items-center"><h2 class="text-xl font-black">Edit tutor profile</h2><button type="button" id="closeEdit" class="text-slate-300 text-2xl" aria-label="Close">×</button></div><input type="hidden" name="id"><label class="text-sm">Full name<input name="name" required maxlength="80" class="field mt-1"></label><label class="text-sm">Email (identity field; cannot be changed here)<input name="email" readonly class="field mt-1 opacity-70"></label><label class="text-sm">Phone<input name="phone" required maxlength="10" pattern="[0-9]{10}" class="field mt-1"></label><label class="text-sm">Subjects / expertise<input name="subjects" required maxlength="180" class="field mt-1"></label><label class="text-sm">Teaching experience<input name="experience" maxlength="80" class="field mt-1"></label><label class="text-sm">Tutor introduction<textarea name="bio" required minlength="20" maxlength="600" rows="4" class="field mt-1"></textarea></label><div class="flex justify-end gap-2"><button type="button" id="cancelEdit" class="btn btn-muted">Cancel</button><button id="saveEdit" class="btn btn-primary">Save changes</button></div></form></dialog>
<script>
const cfg={apiKey:"AIzaSyCFuF2PBq09cKOHBuoLDoypEgrI1Smm4c",authDomain:"englishmates-ratangarh-933f1.firebaseapp.com",projectId:"englishmates-ratangarh-933f1",storageBucket:"englishmates-ratangarh-933f1.firebasestorage.app",messagingSenderId:"501474121790",appId:"1:501474121790:web:5097a43a6be4e7bc07996f6"};
firebase.initializeApp(cfg);const auth=firebase.auth(),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let activeStatus="pending",cursor=null,loaded=[],busy=false;
function notice(message,error=false){$("#notice").textContent=message||"";$("#notice").className="text-sm mt-4 "+(error?"text-rose-300":"text-emerald-300");}
async function api(method,body,params={}){if(!auth.currentUser)throw Error("Please sign in again.");const token=await auth.currentUser.getIdToken();const query=new URLSearchParams(params).toString();const r=await fetch("/.netlify/functions/tutor-applications"+(query?"?"+query:""),{method,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||"Request failed.");return d;}
function badge(status){return '<span class="status status-'+esc(status)+'">'+esc(String(status||"unknown").toUpperCase())+'</span>';}
function render(){const q=$("#search").value.trim().toLowerCase();const filtered=loaded.filter(a=>[a.name,a.email,a.phone,a.subjects].some(v=>String(v||"").toLowerCase().includes(q)));$("#items").innerHTML=filtered.length?filtered.map(a=>'<article class="panel rounded-2xl p-5"><div class="flex flex-wrap justify-between items-start gap-3"><div><h2 class="text-xl font-bold">'+esc(a.name)+'</h2><p class="muted text-sm mt-1">'+esc(a.email)+' · '+esc(a.phone)+'</p></div>'+badge(a.status)+'</div><p class="text-sm text-violet-300 mt-3">Expertise: '+esc(a.subjects)+' · Experience: '+esc(a.experience||"Not specified")+'</p><p class="text-sm text-slate-300 mt-3 whitespace-pre-wrap">'+esc(a.bio)+'</p><p class="muted text-xs mt-3">Applied: '+esc(a.createdAt?new Date(a.createdAt).toLocaleString():"Date unavailable")+'</p><div class="flex flex-wrap gap-2 mt-5"><button class="btn btn-muted" data-action="edit" data-id="'+esc(a.id)+'">Edit profile</button>'+(a.status!=="approved"?'<button class="btn btn-green" data-action="approve" data-id="'+esc(a.id)+'">Approve</button>':'')+(a.status!=="rejected"&&a.status!=="inactive"?'<button class="btn btn-muted" data-action="reject" data-id="'+esc(a.id)+'">Reject</button>':'')+(a.status!=="inactive"?'<button class="btn btn-red" data-action="deactivate" data-id="'+esc(a.id)+'">Deactivate</button>':( '<button class="btn btn-green" data-action="approve" data-id="'+esc(a.id)+'">Reactivate / approve</button>'))+'</div></article>').join(""):'<div class="panel rounded-2xl p-8 text-center muted">No matching tutor records in this view.</div>';}
async function load(reset=true){if(busy)return;busy=true;$("#refresh").disabled=true;if(reset){cursor=null;loaded=[];}try{const params={status:activeStatus,limit:"40"};if(cursor)params.cursor=cursor;const d=await api("GET",null,params);loaded=reset?d.applications:loaded.concat(d.applications);cursor=d.nextCursor||null;$("#more").classList.toggle("hidden",!cursor);render();const counts=d.counts||{};for(const s of ["pending","approved","rejected","inactive"])$("#count-"+s).textContent=counts[s]??"—";}catch(e){notice(e.message,true);}finally{busy=false;$("#refresh").disabled=false;}}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginBtn").disabled=true;try{const f=new FormData(e.currentTarget);await auth.signInWithEmailAndPassword(String(f.get("email")).trim(),String(f.get("password")));await auth.currentUser.reload();if(!auth.currentUser.emailVerified)throw Error("Verify the admin email before continuing.");const d=await api("GET",null,{status:"pending",limit:"1"});$("#identity").textContent=auth.currentUser.email;$("#login").classList.add("hidden");$("#dashboard").classList.remove("hidden");notice("Admin session verified.");await load(true);}catch(e){$("#loginMessage").textContent=e.message;await auth.signOut().catch(()=>{});}finally{$("#loginBtn").disabled=false;}});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-status]");if(!b)return;activeStatus=b.dataset.status;$("#tabs").querySelectorAll("button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));load(true);});
$("#refresh").addEventListener("click",()=>load(true));$("#more").addEventListener("click",()=>load(false));$("#search").addEventListener("input",render);
$("#items").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=loaded.find(x=>x.id===b.dataset.id);if(!a)return;if(b.dataset.action==="edit"){const f=$("#editForm");for(const k of ["id","name","email","phone","subjects","experience","bio"])f.elements[k].value=a[k]||"";$("#editDialog").showModal();return;}let action=b.dataset.action;if(action==="deactivate"&&!confirm("Deactivate "+a.name+"? This hides the tutor from public discovery. Existing bookings and history will be preserved."))return;if(action==="reject"&&!confirm("Reject this tutor application?"))return;if(action==="approve"&&!confirm("Approve or reactivate "+a.name+"? Their Firebase Auth account must have a verified email."))return;b.disabled=true;try{const d=await api("POST",{action:action==="deactivate"?"set-status":"set-status",applicationId:a.id,status:action==="approve"?"approved":action==="reject"?"rejected":"inactive"});notice(d.message);await load(true);}catch(err){notice(err.message,true);}finally{b.disabled=false;}});
function closeDialog(){$("#editDialog").close();}$("#closeEdit").addEventListener("click",closeDialog);$("#cancelEdit").addEventListener("click",closeDialog);
$("#editForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget),body={action:"update-profile",applicationId:f.get("id"),profile:{}};for(const k of ["name","phone","subjects","experience","bio"])body.profile[k]=String(f.get(k)||"").trim();$("#saveEdit").disabled=true;try{const d=await api("POST",body);closeDialog();notice(d.message);await load(true);}catch(err){notice(err.message,true);}finally{$("#saveEdit").disabled=false;}});
$("#logout").addEventListener("click",async()=>{await auth.signOut();$("#dashboard").classList.add("hidden");$("#login").classList.remove("hidden");loaded=[];notice("");});
</script></body></html>
