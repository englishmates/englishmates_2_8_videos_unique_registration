<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutor Applications | Englishmates Admin</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><style>body{background:#080d1b;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.panel{background:#111b30;border:1px solid #293752}.field{background:#080f20;border:1px solid #35445f;color:white}</style></head><body><main class="max-w-4xl mx-auto px-4 py-10"><a href="/" class="font-black text-xl">Englishmates</a><p class="text-xs uppercase tracking-widest text-violet-300 font-bold mt-10">Restricted admin area</p><h1 class="text-3xl font-black mt-2">Tutor applications</h1><section id="login" class="panel rounded-2xl p-6 max-w-md mt-6"><p class="text-slate-400 text-sm">Sign in with the authorized Englishmates admin account.</p><form id="loginForm" class="grid gap-3 mt-4"><input name="email" type="email" required placeholder="Admin email" class="field rounded-xl p-3"><input name="password" type="password" required placeholder="Password" class="field rounded-xl p-3"><button class="rounded-xl bg-violet-600 p-3 font-bold">Sign in</button></form><p id="message" class="text-sm mt-3"></p></section><section id="panel" class="hidden mt-6"><div class="flex justify-between items-center"><p id="identity" class="text-sm text-slate-400"></p><button id="logout" class="text-violet-300 text-sm">Sign out</button></div><div id="items" class="grid gap-4 mt-5"></div></section></main><script>
const cfg={apiKey:"AIzaSyCFuF2PBq09cKOHBuoLDoypEgrI1Smm4c",authDomain:"englishmates-ratangarh-933f1.firebaseapp.com",projectId:"englishmates-ratangarh-933f1",storageBucket:"englishmates-ratangarh-933f1.firebasestorage.app",messagingSenderId:"501474121790",appId:"1:501474121790:web:5097a43a6be4e7bc07996f6"};firebase.initializeApp(cfg);const auth=firebase.auth(),$=s=>document.querySelector(s),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(method,body){const token=await auth.currentUser.getIdToken();const r=await fetch("/.netlify/functions/tutor-applications",{method,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Request failed");return d;}
async function load(){const d=await call("GET");$("#items").innerHTML=d.applications.length?d.applications.map(a=>'<article class="panel rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3"><h2 class="text-xl font-bold">'+esc(a.name)+'</h2><span class="text-xs text-amber-300">PENDING REVIEW</span></div><p class="text-sm text-slate-300 mt-2">'+esc(a.email)+' · '+esc(a.phone)+'</p><p class="text-sm text-violet-300 mt-2">Expertise: '+esc(a.subjects)+' · Experience: '+esc(a.experience)+'</p><p class="text-sm text-slate-300 mt-3 whitespace-pre-wrap">'+esc(a.bio)+'</p><div class="flex gap-3 mt-5"><button data-action="approve" data-id="'+esc(a.id)+'" class="rounded-xl bg-emerald-600 px-4 py-2 font-bold">Approve tutor</button><button data-action="reject" data-id="'+esc(a.id)+'" class="rounded-xl bg-rose-600/20 text-rose-200 px-4 py-2">Reject</button></div></article>').join(""):'<p class="text-slate-400">No pending applications.</p>';}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await auth.signInWithEmailAndPassword(String(f.get("email")).trim(),String(f.get("password")));if(!auth.currentUser.emailVerified)throw Error("Verify admin email first.");await load();$("#identity").textContent=auth.currentUser.email;$("#login").classList.add("hidden");$("#panel").classList.remove("hidden");}catch(err){$("#message").textContent=err.message;}});
$("#items").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;b.disabled=true;try{const d=await call("POST",{action:b.dataset.action,applicationId:b.dataset.id});await load();$("#message").textContent=d.message;}catch(err){$("#message").textContent=err.message;}finally{b.disabled=false;}});
$("#logout").addEventListener("click",async()=>{await auth.signOut();$("#panel").classList.add("hidden");$("#login").classList.remove("hidden");});</script></body></html>
